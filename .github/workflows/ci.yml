name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: coach, POSTGRES_PASSWORD: coach, POSTGRES_DB: coach }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coach" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://coach:coach@localhost:5432/coach
      JWT_SECRET: ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Phase 4 gate: demo login -> see proposal -> accept -> calendar updated (no Anthropic key needed).
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e --workspace web
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: web/test-results, retention-days: 7 }

  # The API/worker image Railway deploys: catch Dockerfile breakage before it reaches a deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t coach-api:ci .
      - run: docker run --rm coach-api:ci node -e "import('@coach/contracts').then(() => console.log('contracts ok'))"
